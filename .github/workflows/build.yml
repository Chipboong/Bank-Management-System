name: Build
on:
    push:
        branches:
            - main
permissions:
    contents: read
jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v6
            - name: Setup java
              uses: actions/setup-java@v5.6.0
              with:
                  distribution: temurin
                  java-version: 26
                  cache: maven
            - name: Build with Maven
              run: mvn -B clean package
 
            - name: Upload jar artifact
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: bank-jar
                  path: target/*.jar
 